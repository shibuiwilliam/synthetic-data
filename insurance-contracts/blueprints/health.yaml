# 傷害・疾病保険（docs/blueprints.md §4.1 health）
genre: health
description: からだの保険。保険金の種類が多く、給付倍率表と等級表を持つ
target_pages: [14, 20]
numbering_scheme: nonlife
default_style: nl-a4-2col-mincho

front_matter:
  cover: true
  preface: true
  purpose_index: false
  toc_with_summaries: true
  toc_depth: 3
  rider_index: true

required:
  - { kind: table, subtype: definitions, min_rows: 12 }
  - { kind: table, subtype: benefit_schedule, min_rows: 5, note: "保険金の種類一覧（入院/手術/通院/死亡/後遺障害）" }
  - { kind: table, subtype: surgery_schedule, min_rows: 8, note: "手術の種類と給付倍率表（別表・C5）" }
  - { kind: table, subtype: grade_schedule, min_rows: 8, note: "後遺障害等級表（抜粋）" }
  - { kind: table, subtype: procedure, min_rows: 4, min_cols: 2, note: "保険金請求時の提出書類表（C7）" }
  - { kind: figure, subtype: timeline, note: "責任開始日・免責期間のタイムライン（D5）" }
  - { kind: figure, subtype: steps, note: "告知から契約までの流れ（D7）" }
  - { kind: box, subtype: margin_note, min_count: 3 }
  - { kind: footnotes, min_count: 10 }

skeleton:
  - id: terms
    kind: chapter
    title_options: ["用語の定義"]
    chars: 2200
    todo: "12〜20語。入院・手術・通院・責任開始期・免責期間など"
    required: [ { kind: table, subtype: definitions, min_rows: 12 } ]

  - id: ch1
    kind: chapter
    title_options: ["傷害条項", "傷害に関する補償"]
    movable: true
    children:
      - { id: ch1_a1, kind: article, title_options: ["この条項の補償内容"], chars: 700 }
      - { id: ch1_a2, kind: article, title_options: ["保険金の種類とお支払いする額"], chars: 1000,
          todo: "名称／支払事由／支払額の3列表。額のセルに算式を入れる",
          required: [ { kind: table, subtype: benefit_schedule, min_rows: 5 },
                      { kind: formula, subtype: inline_boxes } ] }
      - { id: ch1_a3, kind: article, title_options: ["保険金を支払わない場合"], chars: 800,
          required: [ { kind: table, subtype: exclusions, min_rows: 4 } ] }

  - id: ch2
    kind: chapter
    title_options: ["疾病条項", "疾病に関する補償"]
    movable: true
    children:
      - { id: ch2_a1, kind: article, title_options: ["この条項の補償内容"], chars: 700 }
      - { id: ch2_a2, kind: article, title_options: ["責任開始期および免責期間"], chars: 700,
          todo: "免責期間の考え方。タイムライン図を添える",
          required: [ { kind: figure, subtype: timeline } ] }
      - { id: ch2_a3, kind: article, title_options: ["保険金を支払わない場合"], chars: 700,
          required: [ { kind: table, subtype: exclusions, min_rows: 3 } ] }

  - id: ch3
    kind: chapter
    title_options: ["基本条項"]
    children:
      - id: ch3_s1
        kind: section
        title_options: ["契約手続と義務"]
        children:
          - { id: ch3_s1_a1, kind: article, title_options: ["告知義務"], chars: 800, clause: disclosure_duty }
          - { id: ch3_s1_a2, kind: article, title_options: ["通知義務"], chars: 700, clause: notification_duty }
          - { id: ch3_s1_a3, kind: article, title_options: ["保険契約者の住所変更"], chars: 400,
              clause: address_change }
      - id: ch3_s2
        kind: section
        title_options: ["保険料の払込み"]
        children:
          - { id: ch3_s2_a1, kind: article, title_options: ["保険料の払込方法"], chars: 700, clause: premium_payment }
      - id: ch3_s3
        kind: section
        title_options: ["保険金の請求"]
        children:
          - { id: ch3_s3_a1, kind: article, title_options: ["保険金の請求"], chars: 900, clause: claim_procedure,
              todo: "請求時の提出書類を2列表で",
              required: [ { kind: table, subtype: procedure, min_rows: 4, min_cols: 2 } ] }
          - { id: ch3_s3_a2, kind: article, title_options: ["保険金の支払時期"], chars: 700, clause: payment_period }
      - id: ch3_s4
        kind: section
        title_options: ["その他"]
        children:
          - { id: ch3_s4_a1, kind: article, title_options: ["重大事由による解除"], chars: 800,
              clause: serious_cause_termination }
          - { id: ch3_s4_a2, kind: article, title_options: ["保険契約の無効および取消し"], chars: 500,
              clause: invalidity }
          - { id: ch3_s4_a3, kind: article, title_options: ["時効"], chars: 300, clause: prescription }
          - { id: ch3_s4_a4, kind: article, title_options: ["準拠法および管轄"], chars: 300, clause: governing_law }

riders: { count: [2, 3], pool: [rider_hospitalization_plus, rider_womens_disease, rider_advanced_medical, rider_death_benefit] }

appendices:
  - { id: app1, title_options: ["手術の種類および給付倍率表"], table: surgery_schedule, min_rows: 8 }
  - { id: app2, title_options: ["後遺障害等級表"], table: grade_schedule, min_rows: 8 }

variants:
  digit_style: { fullwidth: 0.5, halfwidth: 0.5 }
  paren_style: { fullwidth: 0.3, halfwidth: 0.7 }
  era: { seireki: 0.9, wareki: 0.1 }
  issuer_kind: { stock: 0.8, mutual: 0.2 }
  pet_name: { present: 0.6, absent: 0.4 }
  order_shuffle: [["ch1", "ch2"]]
  styles: [nl-a4-2col-mincho, nl-b5-2col-dense]

budget: { chars_min: 14000, chars_max: 25000, footnotes_min: 10, margin_notes_min: 3 }

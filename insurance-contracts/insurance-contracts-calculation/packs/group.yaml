# 団体保険（genre: group）の計算パック。
genre: group

chapters:
  cover: ["用語の意義および保険金の支払", "用語の意義および給付金の支払", "用語の意味と保険金の支払"]
  basic: ["保険契約の消滅およびその他の事項"]

term_aliases:
  insured: [insured, enrollee, member, joiner]
  policyholder: [policyholder, group_holder, group_body, group]
  beneficiary: [beneficiary]
  hospitalization: [hospitalization]
  surgery: [surgery]
  disability: [severe_disability, disability, disability_state, adl]
  business_day: [business_day]
  responsibility_start: [responsibility_start, liability_start]
fallbacks:
  insured: 被保険者
  policyholder: 保険契約者
  beneficiary: 保険金受取人
  hospitalization: 入院
  surgery: 手術
  disability: 高度障害状態
  business_day: 営業日
  responsibility_start: 責任開始期

vocab:
  rate_name: 支払倍率
  grade_name: 障害の等級
  months_name: 経過月数
  days_name: 日数
  amount_name: 損害の額
  payable_days_name: 支払の対象となる日数
  years_name: 経過年数
  deadline_effect: 保険金を支払います。
  waiting_start: 責任の開始する日
  sub_benefit: 付随する費用
  period_end: 保険期間の末日
  waiting_span: 支払の対象とならない期間
  payable_span: 支払の対象となる期間
  waiting_event: 責任の開始
  mark_pay: ○
  mark_nopay: ×
  legend_pay: 支払います
  legend_nopay: 支払いません
  matrix_row_title: 競技中かどうか
  matrix_col_title: 書面による請求
  matrix_row1: 競技または競技の練習中
  matrix_row2: 試運転または曲技の最中
  matrix_row3: 通常の使用の最中
  matrix_row4: その他の場合
  matrix_col1: 書面による請求があった
  matrix_col2: 口頭での連絡のみ
  matrix_col3: 請求がない
  payable_event: 支払の対象となる期間の開始
  enum_value_header: 取扱い
  enum_value: 支払いません
  exclusion_competition: 加入の申込みの前に発病していた疾病を原因とする場合
  exclusion_no_claim: 必要な書類の提出が行われなかった場合
  q_immobile: 医師の指示による{t:hospitalization}か
  q_min_days: "{t:hospitalization}が{days}以上に及ぶか"
  q_other_cover: 他の団体保険契約から同じ給付が行われるか
  flow_start: 入院の開始

param_ranges:
  deductible: {choices: [5000, 8000, 10000, 15000, 20000], unit: JPY}
  limit: {choices: [100000, 150000, 200000, 300000, 400000, 500000], unit: JPY}
  sub_limit: {choices: [20000, 30000, 50000, 80000, 100000], unit: JPY}
  aggregate_limit: {choices: [1000000, 2000000, 3000000], unit: JPY}
  daily: {choices: [3000, 4000, 5000, 6000, 8000, 10000], unit: JPY}
  min_days: {choices: [2, 3, 4, 5, 7], unit: DAY}
  max_days: {choices: [30, 60, 90, 120, 180], unit: DAY}
  round_unit: {choices: [100, 500, 1000, 5000], unit: JPY}
  max_months: {choices: [12, 18, 24, 36, 60], unit: MONTH}
  rate_top: {choices: [30, 40, 50], unit: PERCENT}
  rate_step: {choices: [5, 10], unit: PERCENT}
  threshold_amount: {choices: [30000, 50000, 80000, 100000, 200000], unit: JPY}
  payment_days: {choices: [30, 45], unit: DAY}
  waiting_days: {choices: [7, 14, 30], unit: DAY}
  max_count: {choices: [2, 3], unit: COUNT}

subjects:
  - key: stay
    benefit: 入院給付金
    anchor: cover
    requires: [hospitalization]
    trigger: "{t:insured}が{t:hospitalization}をした場合"
    patterns: [P03, P14, P18]
    inputs:
      start_date:
        concept: start_date
        desc: 保障の開始した日
      event_date:
        concept: accident_date
        desc: 入院を開始した日
      days: {concept: hospital_days, desc: 入院した日数}
      immobile: {concept: hospitalized, desc: 医師の指示による入院であるかどうか}
      other_cover: {concept: rentacar_paid, desc: 他の団体保険契約から同じ給付が行われるかどうか}
    vocab:
      example_title: 入院給付金の計算例

  - key: procedure
    benefit: 手術給付金
    anchor: cover
    requires: [surgery]
    trigger: "{t:insured}が{t:surgery}を受けた場合"
    patterns: [P04]
    inputs:
      amount: {concept: insured_amount, desc: 保険証券記載の基準となる金額}
      grade: {concept: surgery_kind, min: 1, max: 4, desc: 受けた手術の種類}
    vocab:
      example_title: 手術の種類に応じた支払の例
      grade_name: 手術の種類

  - key: assistance
    benefit: 障害支援給付金
    anchor: cover
    requires: [disability]
    trigger: "{t:insured}が{t:disability}に該当した場合"
    patterns: [P07, P01, P08]
    inputs:
      sub_amount:
        concept: treatment_cost
        desc: 療養に要した費用の額
      amount: {concept: insured_amount, desc: 保険証券記載の基準となる金額}
    vocab:
      example_title: 障害支援給付金の支払の例

  - key: caregiving
    benefit: 介護一時金
    anchor: cover
    requires: []
    trigger: "{t:insured}が介護を要する状態となり、費用を支出した場合"
    patterns: [P06, P02]
    inputs:
      amount: {concept: actual_cost, desc: 介護のために支出した費用の額}
      share_num: {concept: hospital_days, desc: 介護を要した日数}
      share_den: {concept: outpatient_days, desc: 保険証券記載の支払の対象となる日数}
    vocab:
      example_title: 介護一時金の計算例

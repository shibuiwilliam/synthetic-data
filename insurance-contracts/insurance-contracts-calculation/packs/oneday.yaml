# 1日型自動車保険（genre: oneday）の計算パック。
genre: oneday

chapters:
  cover: ["補償条項", "この保険のしくみ"]
  plan: ["プランと保険料", "補償の組合せと保険料", "保険料および割引"]
  basic: ["基本条項"]

term_aliases:
  car: [insured_car, target_car, borrowed_car, camper, rental_car, used_car]
  accident: [accident, mishap]
  insured: [insured, covered]
  policyholder: [policyholder, holder]
  deductible: [deductible]
  use_start: [use_start, use_from, use_date, use_day]
  plan: [plan, basic_cover, optional_cover]
  app: [app, app_screen, app_notice, kaiin_page]
fallbacks:
  car: 対象のお車
  accident: 事故
  insured: 被保険者
  policyholder: 保険契約者
  deductible: 免責金額
  use_start: 利用開始日時
  plan: プラン
  app: お申込画面

vocab:
  rate_name: 支払割合
  grade_name: プランの区分
  months_name: 経過月数
  days_name: 日数
  amount_name: 損害の額
  payable_days_name: 支払の対象となる日数
  years_name: 経過年数
  deadline_effect: 保険金を支払います。
  waiting_start: 責任の開始する日
  sub_benefit: 付随する費用
  period_end: 保険期間の末日
  waiting_span: 支払の対象とならない期間
  payable_span: 支払の対象となる期間
  waiting_event: 責任の開始
  mark_pay: ○
  mark_nopay: ×
  legend_pay: 支払います
  legend_nopay: 支払いません
  matrix_row_title: 競技中かどうか
  matrix_col_title: 書面による請求
  matrix_row1: 競技または競技の練習中
  matrix_row2: 試運転または曲技の最中
  matrix_row3: 通常の使用の最中
  matrix_row4: その他の場合
  matrix_col1: 書面による請求があった
  matrix_col2: 口頭での連絡のみ
  matrix_col3: 請求がない
  payable_event: 支払の対象となる期間の開始
  enum_value_header: 取扱い
  enum_value: 支払いません
  exclusion_competition: 競技、競技の練習または試運転のために{t:car}を使用している間に生じた損害
  exclusion_no_claim: 利用の終了後、遅滞なく書面による請求が行われなかった場合
  q_immobile: "{t:car}が自力で走行できないか"
  q_min_days: 修理に{days}以上を要するか
  q_other_cover: 他の保険契約から同じ費用の保険金が支払われるか
  flow_start: "{t:accident}の発生"

param_ranges:
  deductible: {choices: [3000, 5000, 8000, 10000, 12000, 15000], unit: JPY}
  limit: {choices: [50000, 80000, 100000, 120000, 150000, 200000, 300000], unit: JPY}
  sub_limit: {choices: [10000, 20000, 30000, 40000, 50000, 60000], unit: JPY}
  aggregate_limit: {choices: [300000, 500000, 1000000], unit: JPY}
  daily: {choices: [1500, 2000, 2500, 3000, 4000, 5000], unit: JPY}
  min_days: {choices: [2, 3, 4, 5], unit: DAY}
  max_days: {choices: [5, 7, 10, 14, 20], unit: DAY}
  round_unit: {choices: [100, 500, 1000], unit: JPY}
  max_months: {choices: [12, 18, 24, 36], unit: MONTH}
  rate_top: {choices: [30, 40, 50], unit: PERCENT}
  rate_step: {choices: [5, 10], unit: PERCENT}
  threshold_amount: {choices: [20000, 30000, 50000, 80000, 100000], unit: JPY}
  payment_days: {choices: [20, 30, 45], unit: DAY}
  waiting_days: {choices: [3, 5, 7], unit: DAY}
  max_count: {choices: [2, 3], unit: COUNT}

subjects:
  - key: pane
    benefit: ガラス損害費用保険金
    anchor: cover
    requires: [car]
    trigger: "{t:car}の窓ガラスのみに損害が生じ、これを修理した場合"
    patterns: [P02, P01]
    inputs:
      amount: {concept: repair_cost}
    vocab:
      example_title: ガラスだけが壊れたとき

  - key: substitute
    benefit: 代車費用保険金
    anchor: cover
    requires: [car]
    trigger: "{t:car}の損害により{t:insured}が代わりの車両を借り入れた場合"
    patterns: [P14, P03]
    inputs:
      immobile: {concept: immobile, desc: "{t:car}が自力で走行できない状態にあるかどうか"}
      days: {concept: repair_days, desc: 代わりの車両を借り入れた日数}
      other_cover: {concept: rentacar_paid}
    vocab:
      example_title: 代車費用の計算例

  - key: cargo
    benefit: 積載物保険金
    anchor: cover
    requires: [car]
    trigger: "{t:car}に積載していた{t:insured}の物に損害が生じた場合"
    patterns: [P07, P12, P08]
    inputs:
      sub_amount:
        concept: equipment_value
        desc: 積載物のうち貴重品の価額
      amount: {concept: baggage_value, desc: 積載していた物の損害の額}
      competition: {concept: competition}
      doctor: {concept: written_claim}
    vocab:
      example_title: 積載物の支払の例

  - key: carry
    benefit: 搬送費用保険金
    anchor: cover
    requires: [car]
    trigger: "{t:car}が走行不能となり、{t:insured}がこれを搬送した場合"
    patterns: [P06, P01, P15]
    inputs:
      sub_amount:
        concept: repair_cost
        desc: 応急の修理に要した費用の額
      amount: {concept: actual_cost, desc: 搬送に要した費用の額}
      share_num: {concept: insured_amount, desc: お申込みの際に選んだ補償の額}
      share_den: {concept: agreed_value, desc: 対象のお車の価額}
    vocab:
      example_title: 搬送費用の計算例

  - key: incidental
    benefit: 事故時諸費用保険金
    anchor: cover
    requires: []
    trigger: "{t:insured}が{t:accident}により臨時に費用を支出した場合"
    patterns: [P02, P01, P07, P09]
    inputs:
      items:
        concept: item_loss
        desc: 明細に記載された費用1件ごとの額
      amount: {concept: actual_cost, desc: 臨時に支出した費用の額}
    vocab:
      example_title: 事故時諸費用の支払の例

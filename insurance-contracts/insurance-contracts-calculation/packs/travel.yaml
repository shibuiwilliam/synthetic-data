# 海外旅行保険（genre: travel）の計算パック。
genre: travel

chapters:
  cover: ["補償条項"]
  basic: ["基本条項"]

term_aliases:
  insured: [insured]
  policyholder: [policyholder]
  baggage: [baggage, business_baggage, gear]
  injury: [injury]
  illness: [illness, hospitalization]
  treatment_cost: [treatment_cost, medical_cost]
  rescue_cost: [rescue_cost, search_cost, crisis_cost]
  liability: [liability, liability_damage]
  residence: [residence]
  trip: [trip, tour, business_trip, study_trip, itinerary]
  deductible: [deductible]
  assist: [assist, assistance_desk, support_desk, accident_desk, desk]
fallbacks:
  insured: 被保険者
  policyholder: 保険契約者
  baggage: 携行品
  injury: 傷害
  illness: 疾病
  treatment_cost: 治療費用
  rescue_cost: 救援者費用
  liability: 賠償責任
  residence: 住居
  trip: 旅行
  deductible: 免責金額
  assist: サポートデスク

